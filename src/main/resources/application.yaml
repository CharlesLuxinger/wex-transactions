spring:
  application:
    name: wex-transactions
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wex_transactions}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    openfeign:
      client:
        config:
          treasury-rates:
            connect-timeout: 1000
            read-timeout: 3000
