treasury:
  api:
    base-url: https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/accounting/od

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: wex-transactions
  cloud:
    circuitbreaker:
      resilience4j:
        enabled: true
    openfeign:
      client:
        config:
          treasury-rates:
            connect-timeout: 1000
            read-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wex_transactions}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

resilience4j:
  circuitbreaker:
    instances:
      treasury-rates:
        sliding-window-size: 10
        failure-rate-threshold: 70
        wait-duration-in-open-state: 30s
        minimum-number-of-calls: 5
  bulkhead:
    instances:
      treasury-rates:
        max-concurrent-calls: 5
        max-wait-duration: 500ms
  ratelimiter:
    instances:
      api-purchases:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0
      treasury-api:
        limit-for-period: 10
        limit-refresh-period: 1m
        timeout-duration: 5s
